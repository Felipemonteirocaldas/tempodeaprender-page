<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B52AE" />

    <!-- Tags por rota: substituídas no build por scripts/prerender.mjs -->
    <!--head-meta-->
    <title>Escola Tempo de Aprender — Educação Infantil e Fundamental I em Escada, PE</title>
    <meta name="description" content="Escola Tempo de Aprender em Escada-PE: Educação Infantil e Ensino Fundamental I com metodologias ativas, afeto e mais de 20 anos de tradição. Matrículas abertas." />
    <!--/head-meta-->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts: Inter (variável) + Fredoka + Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@400..700&family=Inter:wght@400..900&display=swap"
      rel="stylesheet"
    />

    <!-- Dados estruturados: escola local (Google Search / Maps) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["School", "Preschool", "ElementarySchool"],
        "@id": "https://www.escolatempodeaprender.com.br/#escola",
        "name": "Escola Tempo de Aprender",
        "url": "https://www.escolatempodeaprender.com.br/",
        "logo": "https://www.escolatempodeaprender.com.br/apple-touch-icon.png",
        "image": "https://www.escolatempodeaprender.com.br/og-image.jpg",
        "description": "Escola de Educação Infantil e Ensino Fundamental I em Escada-PE, com metodologias ativas e mais de 20 anos de tradição.",
        "foundingDate": "2003",
        "telephone": "+55-81-9112-1015",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Avenida Paulo Leite, 485",
          "addressLocality": "Escada",
          "addressRegion": "PE",
          "addressCountry": "BR"
        },
        "areaServed": { "@type": "City", "name": "Escada" },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "07:00",
            "closes": "17:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "08:00",
            "closes": "12:00"
          }
        ],
        "sameAs": ["https://www.instagram.com/escolatempodeaprender24/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
